# mkdocs.yml
site_name: Pysatl TSP Documentation
site_url: https://your-project-url.com
site_description: "Documentation for pysatl-tsp library"

nav:
  - Home: index.md
  - API Reference: api_reference.md
  - Contributing: CONTRIBUTING.md
  - License: LICENSE

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  language: en
  palette:
    # Scheme: Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "indigo"
      accent: "indigo"
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    # Scheme: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: "indigo"
      accent: "indigo"
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
  - pymdownx.superfences: 
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - attr_list
  - md_in_html 
  - def_list 
  - footnotes

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [./pysatl_tsp/]
          options:
            docstring_style: sphinx
            show_object_type: true
            show_module_summary: true
            show_class_inheritance: true
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_object_full_path: false
            show_source: true
            show_bases: true
            show_inherited_members: true
            members: true
