version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    - method: poetry
      path: .       
      groups:      
                  
        - dev

# Sphinx configuration
sphinx:
  configuration: docs/source/conf.py
  builder: html                     
  fail_on_warning: true      
